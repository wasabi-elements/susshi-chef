server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;

    location ~ "^\/susshi-health(.json|.xml|\/[a-z]+(.json|.xml|)|)$" {
        access_log off;
        proxy_set_header Host $http_host;
        proxy_read_timeout 10s;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
