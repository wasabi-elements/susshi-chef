server {
    listen                  8443 ssl;
    listen                  [::]:8443 ssl;

    server_name             _;

    ssl_certificate         ssl/api.crt;
    ssl_certificate_key     ssl/api.key;
    ssl_client_certificate  ssl/ca.pem;

    ssl_verify_client	    optional;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    add_header              Strict-Transport-Security "max-age=31536000; includeSubDomains;";

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $http_host;
    proxy_redirect off;

    access_log  /opt/wasabi/susshi-chef/log/nginx/sic/$logfile_date-access.log  api;
    error_log   /opt/wasabi/susshi-chef/log/nginx/sic/error.log  error;

    location ~ /api/v[0-9]+/gateways/sic.json {
        proxy_pass http://127.0.0.1:3000;
    }

    location /api {
        if ($ssl_client_verify != SUCCESS) {
           return 403;
           break;
        }

        if ($ssl_client_s_dn_cn !~ "^susshid-\S\S\S\S$") {
           return 403;
           break;
        }

        proxy_set_header X-SSL-CLIENT-FINGERPRINT $ssl_client_fingerprint;

        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ {
        return 403;
    }
}
